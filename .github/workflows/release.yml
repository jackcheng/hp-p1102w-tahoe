name: Build and release driver package

# Rebuilds the installer from the unmodified HP payload with the
# version-independent Distribution in package/Distribution, signs and
# notarizes it when the Apple secrets below are set, then publishes it as a
# GitHub release. Run it from the Actions tab (Run workflow).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEVELOPER_ID_INSTALLER_P12       base64 of the exported "Developer ID Installer" .p12
#   DEVELOPER_ID_INSTALLER_PASSWORD  password chosen when exporting the .p12
#   APPLE_ID                         Apple ID email of the developer account
#   APPLE_TEAM_ID                    10-character Team ID
#   APPLE_APP_PASSWORD               app-specific password for that Apple ID
# Without the first two, the package is published unsigned. Without the last
# three, it is signed but not notarized.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: macos-driver-v3

permissions:
  contents: write

env:
  # The original repackaged installer. Its HP payload is reused byte for byte;
  # only the Distribution file is replaced.
  SOURCE_URL: https://github.com/jackcheng/hp-p1102w-tahoe/releases/download/tahoe-driver/HewlettPackardPrinterDrivers-Tahoe.pkg
  SOURCE_SHA256: 706806403a6309d8a144e98920e41450ba9078176bb2f423d644af3994ba9066
  OUTPUT: HP_P1102w_macOS_Driver.pkg

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source package
        run: |
          curl -fsSL -o source.pkg "$SOURCE_URL"
          echo "$SOURCE_SHA256  source.pkg" | shasum -a 256 -c -

      - name: Replace Distribution
        run: |
          python3 tools/replace_distribution.py source.pkg package/Distribution unsigned.pkg
          pkgutil --expand unsigned.pkg check
          cmp check/Distribution package/Distribution
          rm -rf check

      - name: Sign with Developer ID Installer
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::No signing certificate configured; publishing an unsigned package."
            mv unsigned.pkg "$OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v "$KEYCHAIN" | grep -m1 'Developer ID Installer' | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The .p12 does not contain a Developer ID Installer identity."
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          productsign --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp unsigned.pkg "$OUTPUT"
          pkgutil --check-signature "$OUTPUT"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SIGNED: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 != '' }}
        run: |
          if [ "$SIGNED" != "true" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::warning::Notarization skipped (needs signing plus APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD)."
            exit 0
          fi
          set +e
          xcrun notarytool submit "$OUTPUT" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 2h --output-format json | tee notary.json
          set -e
          ID="$(python3 -c 'import json;print(json.load(open("notary.json")).get("id",""))')"
          STATUS="$(python3 -c 'import json;print(json.load(open("notary.json")).get("status",""))')"
          if [ -n "$ID" ]; then
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
          fi
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: ${STATUS:-unknown}. See the log above."
            exit 1
          fi
          xcrun stapler staple "$OUTPUT"
          xcrun stapler validate "$OUTPUT"
          spctl --assess --type install -vv "$OUTPUT"

      - name: Checksum
        run: shasum -a 256 "$OUTPUT" | tee "$OUTPUT.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" "$OUTPUT" "$OUTPUT.sha256" \
            --target "$GITHUB_SHA" \
            --title "HP P1102w driver for macOS (any version)" \
            --latest \
            --notes-file package/RELEASE_NOTES.md

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
